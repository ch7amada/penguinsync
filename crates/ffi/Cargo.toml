[package]
name = "penguinsync-ffi"
description = "UniFFI bindings exposing the PenguinSync core to the Android app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "penguinsync"
# cdylib for the Android .so; rlib so the workspace can still test it natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
penguinsync-net = { workspace = true }

# uniffi — bridge to Kotlin. Built for Android with cargo-ndk; bindings
# generated by uniffi-bindgen into the :core Gradle module's source set.
# Explicit Gradle glue, no third-party plugin (docs/design.md §4.2).
