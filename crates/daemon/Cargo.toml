[package]
name = "penguinsync-daemon"
description = "PenguinSync background daemon for Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "penguinsyncd"
path = "src/main.rs"

[dependencies]
penguinsync-net = { workspace = true }
penguinsync-protocol = { workspace = true }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"
thiserror = "2"

# Intended, later milestones:
# Avahi registration over D-Bus, and a client of the GNOME Shell extension's
# clipboard D-Bus interface, both land with clipboard (M1).
