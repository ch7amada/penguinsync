[package]
name = "penguinsync-ffi"
description = "UniFFI bindings exposing the PenguinSync core to the Android app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "penguinsync"
# cdylib for the Android .so; rlib so the workspace can still test it natively.
crate-type = ["cdylib", "rlib"]

[[bin]]
# `cargo run -p penguinsync-ffi --bin uniffi-bindgen --features uniffi-cli --
#   generate --library <path-to-.so> --language kotlin --out-dir <dir>`
# is the Gradle task's second step, after cargo-ndk builds the .so
# (docs/design.md §4.2 "Build glue").
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[dependencies]
penguinsync-net = { workspace = true }
penguinsync-protocol = { workspace = true }
uniffi = { version = "0.32.0", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[features]
# Off by default: `cli` pulls in clap and friends, dead weight in the
# release cdylib. Only the bindgen invocation itself needs it.
uniffi-cli = ["uniffi/cli"]

# uniffi — bridge to Kotlin. Built for Android with cargo-ndk; bindings
# generated by uniffi-bindgen into the :core Gradle module's source set.
# Explicit Gradle glue, no third-party plugin (docs/design.md §4.2).
