name: rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain version comes from rust-toolchain.toml — pinned exactly,
      # so CI and F-Droid build with the same compiler (docs/reproducible-builds.md).
      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Format
        run: cargo fmt --all --check

      # Clippy as an error from commit one: the cheapest Rust teacher available.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace

# Release automation lives in release.yml, which builds the Linux tarball and
# the signed APK on a version tag.
#
# An Android job (assembleDebug + unit tests) still belongs here. It needs the
# SDK, the NDK and cargo-ndk on every push — several minutes a run — so it is
# deliberately not in this fast pre-merge job yet. release.yml exercises the
# same toolchain, and `workflow_dispatch` runs it on demand.
