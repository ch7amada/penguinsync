[package]
name = "penguinsync-daemon"
description = "PenguinSync background daemon for Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "penguinsyncd"
path = "src/main.rs"

[dependencies]
penguinsync-net.workspace = true
penguinsync-protocol = { workspace = true }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
url = "2"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"
thiserror = "2"
tokio-stream = { version = "0.1.19", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
async-trait = "0.1.92"

# Intended, later milestones:
# Avahi registration over D-Bus (M1 works without it — the QR carries
# candidate addresses; discovery-while-present is a nice-to-have).
